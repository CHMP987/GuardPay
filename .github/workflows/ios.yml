# Plan Persona 2: Hito 0 (día 8) links the shared module for iOS; iOS-A (día 9) builds
# iosApp/ and runs it in the simulator over the in-memory simulation.
# Nobody on the team has a Mac (G3), so this runner is the only place iOS links.
# No Apple ID, certificates or provisioning profiles here: nothing is signed.
name: ios

on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: read

env:
  # swift-sodium 0.11.0 (the commit the tag points to). Its Clibsodium.xcframework ships libsodium.a per slice.
  SODIUM_COMMIT: cfd195c76882aa9b997560ca7cb95d72fbf5db00
  XCODE_APP: /Applications/Xcode_16.4.app
  XCODEGEN_VERSION: "2.46.0"

defaults:
  run:
    shell: bash

jobs:
  link:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: Fetch libsodium (swift-sodium, pinned commit)
        run: |
          base="https://raw.githubusercontent.com/jedisct1/swift-sodium/$SODIUM_COMMIT/Clibsodium.xcframework"
          dir="$RUNNER_TEMP/Clibsodium.xcframework"
          for slice in ios-arm64_arm64e ios-arm64_arm64e_x86_64-simulator; do
            mkdir -p "$dir/$slice"
            curl -fsSL "$base/$slice/libsodium.a" -o "$dir/$slice/libsodium.a"
            lipo -info "$dir/$slice/libsodium.a"
          done
          shasum -a 256 "$dir"/*/libsodium.a
          echo "SODIUM_DIR=$dir" >> "$GITHUB_ENV"

      - name: Link framework and test executable (simulator)
        run: >
          ./gradlew --no-daemon --stacktrace -Pgp.sodium="$SODIUM_DIR"
          :app:shared:linkDebugFrameworkIosSimulatorArm64
          :app:shared:linkDebugTestIosSimulatorArm64

      - name: Run commonTest on the simulator
        continue-on-error: true
        run: ./gradlew --no-daemon -Pgp.sodium="$SODIUM_DIR" :app:shared:iosSimulatorArm64Test

      - name: Link device framework (arm64, unsigned)
        continue-on-error: true
        run: ./gradlew --no-daemon -Pgp.sodium="$SODIUM_DIR" :app:shared:linkDebugFrameworkIosArm64

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: |
            app/shared/build/reports/tests/iosSimulatorArm64Test/
            app/shared/build/test-results/iosSimulatorArm64Test/
          if-no-files-found: ignore

  simulator:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode and boot a simulator
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          sim=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS-18")) | .value[] | select(.name == "iPhone 16")][0].udid')
          xcrun simctl list runtimes | grep iOS
          test -n "$sim" && test "$sim" != null || { xcrun simctl list devices available; exit 1; }
          echo "SIM=$sim" >> "$GITHUB_ENV"
          # Show the on-screen keyboard, so the UI test types like a person would.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$sim"
          xcrun simctl bootstatus "$sim" -b

      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" -o "$RUNNER_TEMP/xcodegen.zip"
          shasum -a 256 "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          bin=$(dirname "$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen | head -1)")
          echo "$bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: |
          xcodegen --version
          cd iosApp && xcodegen generate

      - name: Build app and UI tests (simulator, unsigned)
        run: |
          mkdir -p out
          xcodebuild build-for-testing -project iosApp/GuardPay.xcodeproj -scheme GuardPay \
            -configuration Debug -destination "id=$SIM" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO > out/build.log 2>&1 || { grep -E "error:" out/build.log | head -30; tail -80 out/build.log; exit 1; }
          grep -E "^\*\*|error:" out/build.log | tail -20

      - name: Launch, screenshot and log
        run: |
          app=build/dd/Build/Products/Debug-iphonesimulator/GuardPay.app
          xcrun simctl install "$SIM" "$app"
          xcrun simctl launch "$SIM" com.guardpay.ios
          sleep 25
          xcrun simctl io "$SIM" screenshot out/launch.png
          xcrun simctl spawn "$SIM" launchctl list | grep -i guardpay || echo "GuardPay is not running"
          xcrun simctl spawn "$SIM" log show --last 5m --style compact --predicate 'process == "GuardPay"' > out/app.log || true
          wc -l out/app.log
          grep -iE "error|fault|exception|crash" out/app.log | tail -20 || true
          xcrun simctl terminate "$SIM" com.guardpay.ios || true

      - name: UI test, scenes 1-3 (simulation)
        run: |
          set +e
          mkdir -p out/ui
          TEST_RUNNER_GP_SHOTS="$PWD/out/ui" xcodebuild test-without-building -project iosApp/GuardPay.xcodeproj \
            -scheme GuardPay -destination "id=$SIM" -derivedDataPath build/dd \
            -resultBundlePath out/ui.xcresult CODE_SIGNING_ALLOWED=NO > out/uitest.log 2>&1
          status=$?
          grep -E "Test Case|error:|\*\*" out/uitest.log | tail -40
          xcrun simctl spawn "$SIM" log show --last 15m --style compact --predicate 'process == "GuardPay"' > out/app-uitest.log
          grep -A40 "GuardPay uncaught" out/app-uitest.log | head -60
          exit $status

      - name: Collect crash reports
        if: always()
        run: mkdir -p out/crash && cp ~/Library/Logs/DiagnosticReports/GuardPay* out/crash/ 2>/dev/null || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: out/
          if-no-files-found: ignore
