# Hito 0 (plan Persona 2, día 8): link the shared module for the iOS simulator on macOS.
# Nobody on the team has a Mac (G3), so this runner is the only place iOS links.
# No Apple ID, certificates or provisioning profiles here: nothing is signed.
name: ios

on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: read

env:
  # swift-sodium 0.11.0 (the commit the tag points to). Its Clibsodium.xcframework ships libsodium.a per slice.
  SODIUM_COMMIT: cfd195c76882aa9b997560ca7cb95d72fbf5db00
  XCODE_APP: /Applications/Xcode_16.4.app

jobs:
  link:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: Fetch libsodium (swift-sodium, pinned commit)
        run: |
          base="https://raw.githubusercontent.com/jedisct1/swift-sodium/$SODIUM_COMMIT/Clibsodium.xcframework"
          dir="$RUNNER_TEMP/Clibsodium.xcframework"
          for slice in ios-arm64_arm64e ios-arm64_arm64e_x86_64-simulator; do
            mkdir -p "$dir/$slice"
            curl -fsSL "$base/$slice/libsodium.a" -o "$dir/$slice/libsodium.a"
            lipo -info "$dir/$slice/libsodium.a"
          done
          shasum -a 256 "$dir"/*/libsodium.a
          echo "SODIUM_DIR=$dir" >> "$GITHUB_ENV"

      - name: Link framework and test executable (simulator)
        run: >
          ./gradlew --no-daemon --stacktrace -Pgp.sodium="$SODIUM_DIR"
          :app:shared:linkDebugFrameworkIosSimulatorArm64
          :app:shared:linkDebugTestIosSimulatorArm64

      - name: Run commonTest on the simulator
        continue-on-error: true
        run: ./gradlew --no-daemon -Pgp.sodium="$SODIUM_DIR" :app:shared:iosSimulatorArm64Test

      - name: Link device framework (arm64, unsigned)
        continue-on-error: true
        run: ./gradlew --no-daemon -Pgp.sodium="$SODIUM_DIR" :app:shared:linkDebugFrameworkIosArm64

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reports
          path: |
            app/shared/build/reports/tests/iosSimulatorArm64Test/
            app/shared/build/test-results/iosSimulatorArm64Test/
          if-no-files-found: ignore
