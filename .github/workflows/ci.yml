# Contracts and the shared client on every push and pull request. Offline only:
# *LiveTest* stays excluded without -PliveTestnet, so nothing here touches testnet,
# FriendBot or a key. iOS linking stays in ios.yml (needs macOS).
name: ci

on:
  push:
    branches: [main, ios]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The version the GH suite last passed with locally.
      - name: Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustc --version

      - name: cargo test (account, guardian_hold, hold_registry)
        run: cargo test --locked -p account -p guardian_hold -p hold_registry

  # Builds the three deployable wasm files and prints their sha256. account and
  # hold_registry are compared with the hashes on testnet (evidence/stellar/deployment.md):
  # a match shows this build reproduces the deployed code. A mismatch is reported, not fatal.
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The toolchain the testnet wasm was built with (docs/DEPENDENCIES.md).
      - name: Rust 1.92.0 + wasm32v1-none
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target wasm32v1-none
          rustup default 1.92.0
          rustc --version

      - name: stellar-cli 28.1.0
        run: |
          curl -fsSL -o stellar.tar.gz https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  stellar.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf stellar.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version

      - name: stellar contract build
        run: |
          for p in account guardian_hold hold_registry; do
            stellar contract build --package "$p"
          done

      - name: sha256
        run: |
          cd target/wasm32v1-none/release
          sha256sum account.wasm guardian_hold.wasm hold_registry.wasm | tee wasm.sha256
          check() {
            if [ "$(sha256sum "$1" | cut -d' ' -f1)" = "$2" ]; then
              echo "$1 matches testnet"
            else
              echo "::warning::$1 does not match the testnet hash $2"
            fi
          }
          check account.wasm 986956ccfd0f134bbbd56dfdcfca1def12f4bf61676ef0efd762c2eafd37cf3b
          check hold_registry.wasm 031173c212bdec97626a952c7edc5d624cf30434295d3b48d162bd678d60d0cb

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            target/wasm32v1-none/release/account.wasm
            target/wasm32v1-none/release/guardian_hold.wasm
            target/wasm32v1-none/release/hold_registry.wasm
            target/wasm32v1-none/release/wasm.sha256
          retention-days: 30

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # allTests also runs checkCommonMainArchitecture, checkDependencyGraph,
      # checkUiVocabulary and checkGuardianSurface. The runner's ANDROID_HOME
      # stands in for the gitignored local.properties.
      - name: Shared tests and architecture checks
        run: ./gradlew --no-daemon --stacktrace :app:shared:allTests

      - name: Android debug APK and release wiring
        run: ./gradlew --no-daemon --stacktrace :app:android:assembleDebug :app:android:compileReleaseKotlin

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/shared/build/reports/tests/
          retention-days: 7
