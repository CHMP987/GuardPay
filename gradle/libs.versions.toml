# Exact versions only: never ranges, never "latest".
# Kotlin, AGP, Compose MP, coroutines and serialization match what
# com.soneso.stellar:stellar-sdk:1.14.0 itself builds with (its build.gradle.kts
# and smart-account-demo at tag v1.14.0), so the KMP klibs stay compatible.
[versions]
kotlin = "2.2.20"
agp = "8.12.3"
compose-multiplatform = "1.9.1"
stellar-sdk = "1.14.0"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"
# Already resolved transitively by stellar-sdk 1.14.0; declared so the UI can format ledger times.
kotlinx-datetime = "0.7.1"
androidx-activity-compose = "1.8.2"
# Instrumented tests only (Keystore signer on a device or emulator).
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"
android-compileSdk = "35"
android-targetSdk = "35"
# Passkeys (SHOULD, GH-33) need API 28+.
android-minSdk = "28"

[libraries]
stellar-sdk = { module = "com.soneso.stellar:stellar-sdk", version.ref = "stellar-sdk" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
