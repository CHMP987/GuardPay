[workspace]
resolver = "2"
members = [
    "contracts/account",
    "contracts/guardian_hold",
    "contracts/hold_registry",
]

# stellar-accounts (vendored) inherits these when resolved as a path dep of this workspace.
[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/OpenZeppelin/stellar-contracts"
version = "0.7.1"

[workspace.dependencies]
soroban-sdk = "28.0.0"
serde = { version = "1", default-features = false }
serde-json-core = { version = "0.6.0", default-features = false }
soroban-test-helpers = "0.2.4"
ed25519-dalek = "2.1.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
hex-literal = "1.0.0"
