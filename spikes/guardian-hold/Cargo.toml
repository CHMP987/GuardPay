[package]
name = "guardian-hold-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib"]
doctest = false

[dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }

# Its own workspace, outside the production one (the root Cargo.toml excludes spikes/).
[workspace]
members = ["account", "guardian_hold", "hold_registry"]
